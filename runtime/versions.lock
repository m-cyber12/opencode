# Pinned components for the embedded runtime.
# Bumping any line = deliberate PR; the first CI run validates every URL resolves.
# Treat ALL of these as hypotheses until gates G1-G8 report PASS.

# Alpine minirootfs (os.arch/aarch64 branch tag on alpinelinux/alpine-ci style tarballs)
ALPINE_MINIROOTFS_URL=https://github.com/alpinelinux/alpine-chroot-install/releases/download/v14.1.1/alpine-chroot-install-v14.1.1-aarch64.tar.gz
# Fallback canonical location used by build script if the above 404s:
ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine
ALPINE_BRANCH=v3.20

# Bun — musl STATIC build for aarch64 Linux (the hypothesis under test inside proot)
BUN_VERSION=1.1.34
BUN_ASSET=bun-linux-arm64-musl.zip

# OpenCode — installed INTO the rootfs via `bun install -g` at image build time
OPENCODE_PACKAGE=opencode-ai
OPENCODE_VERSION=0.4.4

# Guest toolchain (installed from Alpine repos inside the rootfs)
ALPINE_PACKAGES=bash git nodejs npm ripgrep curl ca-certificates openssh-client

# proot — built from source with the seccomp/fchmodat tolerance patch (see build-proot.sh)
PROOT_REPO=https://github.com/proot-me/proot.git
PROOT_REF=v5.4.0

# Host-side sanity floor (emulator/device)
MIN_ANDROID_API=26
