name: Runtime Gates (G1–G15)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/build-runtime.sh'
      - 'scripts/build-proot.sh'
      - 'versions.lock'

permissions:
  contents: read

jobs:
  gates:
    name: G1–G15 on Emulator (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download runtime artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-runtime-arm64
          path: runtime/artifacts

      - name: Verify artifacts present
        run: |
          ls -lh runtime/artifacts/
          test -f runtime/artifacts/rootfs.tar.gz
          test -f runtime/artifacts/rootfs.sha256
          test -f runtime/artifacts/libproot.so

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          emulator: true
          arch: arm64

      - name: Copy runtime into app assets
        run: |
          mkdir -p app/src/main/assets/runtime
          cp runtime/artifacts/rootfs.tar.gz app/src/main/assets/runtime/
          cp runtime/artifacts/rootfs.sha256 app/src/main/assets/runtime/

      - name: Build Debug APK with real runtime
        run: ./gradlew assembleDebug

      - name: Start emulator (arm64)
        uses: android-actions/start-emulator@v3
        with:
          api-level: 35
          arch: arm64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -memory 2048

      - name: Wait for emulator boot
        run: |
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'

      - name: Install APK
        run: adb install -r app/build/outputs/apk/debug/app-debug.apk

      - name: Run Instrumentation Gates (G1–G15)
        run: |
          adb shell am instrument -w -r \
            -e class dev.opencode.android.gates.G1_NativeHostLaunch \
            -e class dev.opencode.android.gates.G2_ExecutionLayerBoots \
            -e class dev.opencode.android.gates.G3_RealShellExecutes \
            -e class dev.opencode.android.gates.G4_RealRuntimeExecutes \
            -e class dev.opencode.android.gates.G5_OpenCodeStarts \
            -e class dev.opencode.android.gates.G6_HealthEndpointResponds \
            -e class dev.opencode.android.gates.G7_ShellToolWorks \
            -e class dev.opencode.android.gates.G8_FileReadWrite \
            -e class dev.opencode.android.gates.G9_RealGitWorks \
            -e class dev.opencode.android.gates.G10_McpStdioWorks \
            -e class dev.opencode.android.gates.G11_SSEStreaming \
            -e class dev.opencode.android.gates.G12_PermissionsFlow \
            -e class dev.opencode.android.gates.G13_StopRestart \
            -e class dev.opencode.android.gates.G14_AppRestartReconnect \
            -e class dev.opencode.android.gates.G15_EndToEndTask \
            dev.opencode.android.test/androidx.test.runner.AndroidJUnitRunner

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: |
            **/gate-*.log
            **/test-results/