name: runtime-gates

# Phase A: EMPIRICAL gates for the embedded local runtime.
# Every failed job auto-publishes full diagnostics to the public `gate-report` branch.

on:
  workflow_dispatch:
  pull_request:
    paths: ["runtime/**", "app/src/main/java/com/opencode/client/runtime/**", ".github/workflows/runtime-gates.yml"]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- build runtime bundle
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build proot + rootfs inside aarch64 Alpine
        run: |
          mkdir -p out
          set -o pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/rt -w /rt \
            alpine:3.20 sh /rt/runtime/ci-inside.sh 2>&1 | tee out/build.log

      - name: Verify bundle contents
        run: |
          test -f out/libproot.so
          test -f out/libproot-loader.so
          test -f out/opencode-rootfs.tar.gz
          test -s out/gates-manifest.txt
          cat out/gates-manifest.txt

      - name: Publish build diagnostics (always)
        if: always()
        run: |
          chmod +x runtime/ci/publish-diag.sh
          runtime/ci/publish-diag.sh "${{ github.run_id }}" out/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-runtime-bundle
          path: |
            out/libproot.so
            out/libproot-loader.so
            out/opencode-rootfs.tar.gz
            out/gates-manifest.txt
            out/versions.lock
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------- emulator gate matrix
  emulator-gates:
    needs: build-runtime
    runs-on: macos-14   # M1 hardware: required for arm64-v8a Android emulator images
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: opencode-runtime-bundle
          path: out

      - name: Place runtime artifacts into the APK layout
        run: |
          set -euxo pipefail
          LIBDIR=app/src/main/jniLibs/arm64-v8a
          ASSETDIR=app/src/main/assets/runtime
          mkdir -p "$LIBDIR" "$ASSETDIR"
          cp out/libproot.so            "$LIBDIR/libopx-proot.so"
          cp out/libproot-loader.so     "$LIBDIR/libopx-proot-loader.so"
          cp out/opencode-rootfs.tar.gz "$ASSETDIR/opencode-rootfs-arm64.tar.gz"
          cp out/gates-manifest.txt     "$ASSETDIR/gates-manifest.txt"
          cp out/versions.lock          "$ASSETDIR/versions.lock"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble gated debug APK + tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee assemble.log

      - name: Run gates G1-G8 on emulator (API 34, arm64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_atd
          profile: pixel_6
          ram-size: 6G
          disk-size: 12G
          emulator-boot-timeout: 1200
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace 2>&1 | tee connected.log; test ${PIPESTATUS[0]} -eq 0

      - name: Publish gate summary + logs (always)
        if: always()
        run: |
          chmod +x runtime/ci/publish-diag.sh
          LOG=$(find app/build -name "TEST-*.xml" -path "*Connected*" | head -1 || true)
          
          {
            echo "# Embedded runtime gates — run ${{ github.run_id }} (${{ github.ref_name }})"
            echo "- job conclusion: ${{ job.status }}"
            echo '```'
            [ -n "$LOG" ] && grep -h "result=" "$LOG" | sed 's/<[^>]*>//g' || echo "(no gate lines found)"
            echo '```'
          } > /tmp/index.md
          
          FILES=()
          [ -n "$LOG" ] && FILES+=("$LOG")
          [ -f assemble.log ] && FILES+=("assemble.log")
          [ -f connected.log ] && FILES+=("connected.log")
          runtime/ci/publish-diag.sh "${{ github.run_id }}" "${FILES[@]:-assemble-missing.log}"
          
          # index.md must land AFTER logs so it sits at branch root
          git checkout -B gate-report origin/gate-report 2>/dev/null || git checkout -B gate-report
          cp /tmp/index.md ./index.md
          git config user.name  "gate-bot"
          git config user.email "actions@github.com"
          git add index.md
          git commit -qm "gate summary for run ${{ github.run_id }}" || exit 0
          git push -q origin gate-report

  # ---------------------------------------------------------------- fast JVM safety net
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee unit.log

      - name: Publish unit-test diagnostics (always)
        if: always()
        run: |
          chmod +x runtime/ci/publish-diag.sh
          FILES=(unit.log)
          for x in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$x" ] && FILES+=("$x")
          done
          runtime/ci/publish-diag.sh "${{ github.run_id }}" "${FILES[@]:-unit-missing.log}"
