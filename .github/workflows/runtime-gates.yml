name: runtime-gates

# Phase A: EMPIRICAL gates for the embedded local runtime.
# Nothing about jniLibs-exec / proot / Bun-under-proot / OpenCode-under-Bun is assumed;
# every claim must show up as PASS here, on a real Android emulator at the target API level.

on:
  workflow_dispatch:
  pull_request:
    paths: ["runtime/**", "app/src/main/java/com/opencode/client/runtime/**", ".github/workflows/runtime-gates.yml"]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- build runtime bundle
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build proot + rootfs inside aarch64 Alpine
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/rt -w /rt \
            alpine:3.20 sh /rt/runtime/ci-inside.sh

      - name: Verify bundle contents
        run: |
          test -f out/libproot.so
          test -f out/libproot-loader.so
          test -f out/opencode-rootfs.tar.gz
          test -s out/gates-manifest.txt
          cat out/gates-manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-runtime-bundle
          path: |
            out/libproot.so
            out/libproot-loader.so
            out/opencode-rootfs.tar.gz
            out/gates-manifest.txt
            out/versions.lock
          retention-days: 14

  # ---------------------------------------------------------------- emulator gate matrix
  emulator-gates:
    needs: build-runtime
    runs-on: macos-14   # M1 hardware: required for arm64-v8a Android emulator images
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: opencode-runtime-bundle
          path: out

      - name: Place runtime artifacts into the APK layout
        run: |
          set -euxo pipefail
          LIBDIR=app/src/main/jniLibs/arm64-v8a
          ASSETDIR=app/src/main/assets/runtime
          mkdir -p "$LIBDIR" "$ASSETDIR"
          cp out/libproot.so        "$LIBDIR/libopx-proot.so"
          cp out/libproot-loader.so "$LIBDIR/libopx-proot-loader.so"
          cp out/opencode-rootfs.tar.gz "$ASSETDIR/opencode-rootfs-arm64.tar.gz"
          cp out/gates-manifest.txt  "$ASSETDIR/gates-manifest.txt"
          cp out/versions.lock       "$ASSETDIR/versions.lock"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble gated debug APK + tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run gates G1-G8 on emulator (API 34, arm64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_atd
          profile: pixel_6
          ram-size: 6G
          disk-size: 12G
          emulator-boot-timeout: 1200
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Publish gate summary (always)
        if: always()
        run: |
          LOG=$(find app/build -name "TEST-*.xml" -path "*Connected*" | head -1 || true)
          {
            echo "# Embedded runtime gates"
            echo '```'
            grep -h "result=" "$LOG" | sed 's/<[^>]*>//g' || echo "(no gate lines found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          
          if grep -h "result=" "$LOG" | grep -q "FAIL"; then
            echo "::error::One or more runtime gates FAILED — stop and investigate that exact failure."
            exit 1
          fi

      - name: Expose gate report publicly (always)
        if: always()
        env:
          REPORT: |
            # Embedded runtime gates — run ${{ github.run_id }} (${{ github.ref_name }})
            ```
            LOG=$(find app/build -name "TEST-*.xml" -path "*Connected*" | head -1 || true)
            grep -h "result=" "$LOG" | sed 's/<[^>]*>//g' || echo "(no gate lines found)"
            ```
        run: |
          set -e
          echo "$REPORT" > /tmp/gate-summary.md
          LOG=$(find app/build -name "TEST-*.xml" -path "*Connected*" | head -1 || true)
          {
            echo "# Embedded runtime gates — run ${{ github.run_id }} (${{ github.ref_name }})"
            echo "- conclusion: ${{ job.status }}"
            echo '```'
            grep -h "result=" "$LOG" | sed 's/<[^>]*>//g' || echo "(no gate lines found)"
            echo '```'
          } > /tmp/gate-summary.md

          git config user.name  "gate-bot"
          git config user.email "actions@github.com"
          git switch --orphan _report
          cp /tmp/gate-summary.md ./index.md
          git add index.md
          git commit -qm "gate summary for run ${{ github.run_id }}"
          git push -f origin HEAD:gate-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-logs
          path: app/build/outputs/androidTest-results/**/*

  # ---------------------------------------------------------------- fast JVM safety net
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: ./gradlew :app:testDebugUnitTest --stacktrace
